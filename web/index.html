<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>小喵 · MewHelp 售后客服</title>
<style>
  :root{
    --bg:#fff7f0; --card:#ffffff;
    --accent:#ff7a9e; --accent-deep:#ee5d86; --accent-soft:#ffe1ea;
    --ink:#5a4448; --muted:#bfa9ae;
    --ai-bubble:#ffffff; --ai-border:#ffe3ec;
    --user-bubble:#ffe1ea; --user-text:#7a2f45;
    --shadow:0 6px 18px rgba(255,150,170,.14);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:linear-gradient(160deg,#fff7f0 0%,#ffeef4 100%);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    color:var(--ink); display:flex; justify-content:center; align-items:stretch;
  }
  #app{
    width:100%; max-width:680px; margin:0 auto; height:100vh; min-height:480px;
    display:flex; flex-direction:column; background:var(--card);
    box-shadow:var(--shadow); border-left:1px solid #ffe3ec; border-right:1px solid #ffe3ec;
  }
  header{
    display:flex; align-items:center; gap:12px; padding:14px 18px;
    background:linear-gradient(120deg,#ffd9e3,#ffc7d8 55%,#ffdcd0);
    border-bottom:2px solid #ffd3df; flex:0 0 auto;
  }
  header .brand{font-weight:700; font-size:17px; color:#7a2f45; letter-spacing:.5px}
  header .sub{font-size:12px; color:#a9687b; margin-top:2px}
  .status-dot{width:8px;height:8px;border-radius:50%;background:#4caf7d;box-shadow:0 0 0 3px rgba(76,175,125,.18); margin-left:auto}
  #chat{flex:1 1 auto; overflow-y:auto; padding:18px 16px 6px; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth}
  .row{display:flex; gap:8px; align-items:flex-end; animation:pop .22s ease-out}
  .row.user{flex-direction:row-reverse}
  @keyframes pop{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
  .avatar{width:34px;height:34px;flex:0 0 34px; filter:drop-shadow(0 2px 3px rgba(255,150,170,.25))}
  .bubble{max-width:74%; padding:10px 14px; border-radius:18px; line-height:1.6; font-size:15px; word-break:break-word; white-space:pre-wrap}
  .row.user .bubble{background:var(--user-bubble); color:var(--user-text); border-bottom-right-radius:6px}
  .row.ai .bubble{background:var(--ai-bubble); border:1px solid var(--ai-border); border-bottom-left-radius:6px; box-shadow:0 2px 8px rgba(255,170,190,.10)}
  .row.system{justify-content:center}
  .row.system .bubble{background:#fff; border:1px dashed #f2c9d4; color:#a9687b; font-size:13px; border-radius:999px; padding:6px 14px; max-width:88%}
  .bubble.streaming::after{content:"▍"; color:var(--accent); animation:blink 1s steps(2) infinite; margin-left:1px}
  @keyframes blink{50%{opacity:0}}
  .typing .bubble{display:flex; gap:4px; align-items:center}
  .typing .dot{width:7px;height:7px;border-radius:50%;background:#ffb3c6;animation:hop 1s infinite}
  .typing .dot:nth-child(2){animation-delay:.15s}.typing .dot:nth-child(3){animation-delay:.3s}
  @keyframes hop{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
  .err-text{color:#d6455d}
  #inputbar{flex:0 0 auto; display:flex; gap:8px; align-items:flex-end; padding:12px 14px 16px; background:#fff; border-top:1px solid #ffe9ef}
  #box{flex:1 1 auto; resize:none; border:1.5px solid #ffd9e3; border-radius:16px; padding:9px 12px;
    font:inherit; color:var(--ink); background:#fffafc; max-height:120px; outline:none; line-height:1.5}
  #box:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,122,158,.15)}
  #send{flex:0 0 auto; border:none; border-radius:16px; padding:9px 18px; background:linear-gradient(120deg,var(--accent),var(--accent-deep));
    color:#fff; font-size:15px; cursor:pointer; font-weight:600; box-shadow:0 3px 10px rgba(255,122,158,.35)}
  #send:hover{filter:brightness(1.05)}
  #send:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}
  #reset{flex:0 0 auto; border:1px solid #ffd3df; background:#fff; color:#a9687b; border-radius:16px; padding:9px 12px; cursor:pointer; font-size:13px}
  #reset:hover{background:#fff5f8}
  /* 工具轨迹徽章 */
  .tool-trail{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 2px 42px; align-self:flex-start; max-width:74%}
  .chip{display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:3px 9px; border-radius:999px;
    background:#fff6f9; border:1px solid #ffd3df; color:#8c5a6b; box-shadow:0 1px 4px rgba(255,160,180,.12)}
  .chip.running{background:#fff9ec; border-color:#ffe0b0; color:#9a7326}
  .chip.ok{background:#f0fbf4; border-color:#c8ecd5; color:#3f7d59}
  .chip.error{background:#fff0f2; border-color:#ffc9d2; color:#b93a52}
  .chip .spin{display:inline-block; animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  footer{flex:0 0 auto; text-align:center; font-size:11px; color:#d4b6bf; padding:6px 0 8px}
  .brandrow{display:flex; align-items:center; gap:10px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar cat-svg"></div>
    <div>
      <div class="brand">小喵 · MewHelp 售后客服</div>
      <div class="sub">订单咨询 · 退换维修 · 有问必答喵~</div>
    </div>
    <span class="status-dot" id="dot" title="在线"></span>
  </header>

  <div id="chat" aria-live="polite"></div>

  <div id="inputbar">
    <button id="reset" title="清空并开启新会话">🔄 新会话</button>
    <textarea id="box" rows="1" placeholder="和我说说你的问题吧,比如:订单20260901001还没发货…"></textarea>
    <button id="send">发送</button>
  </div>
  <footer>小猫客服在线 · 消息由 AI 生成,请以店铺正式答复为准</footer>
</div>

<script>
const SVG_CAT = `
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffc2d2"/><stop offset="1" stop-color="#ff9ab4"/>
  </linearGradient></defs>
  <path d="M14 30 6 10l20 10a26 26 0 0 1 12 0l20-10-8 20a26 26 0 0 1-4 28 26 26 0 0 1-44 0 26 26 0 0 1-4-28z"
        fill="url(#c1)" stroke="#f0839f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M10 18 6 14M54 18 58 14" stroke="#f0839f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="23" cy="35" r="3.4" fill="#5a3a42"/><circle cx="41" cy="35" r="3.4" fill="#5a3a42"/>
  <circle cx="25" cy="33.5" r="1" fill="#fff"/><circle cx="43" cy="33.5" r="1" fill="#fff"/>
  <path d="M24 41c3 3 13 3 16 0" stroke="#5a3a42" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M32 41v3" stroke="#f0839f" stroke-width="2" stroke-linecap="round"/>
  <path d="M18 45c-5-1-7 2-6 5M46 45c5-1 7 2 6 5" stroke="#f0839f" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
  <ellipse cx="18" cy="42" rx="3" ry="2" fill="#ffd0d8" opacity=".9"/>
  <ellipse cx="46" cy="42" rx="3" ry="2" fill="#ffd0d8" opacity=".9"/>
</svg>`;

const $chat = document.getElementById('chat');
const $box = document.getElementById('box');
const $send = document.getElementById('send');
const $reset = document.getElementById('reset');

let conversationId = null;
let userId = localStorage.getItem('mewhelp_user_id');
if (!userId) {
  const rid = (typeof crypto !== 'undefined' && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  userId = 'web-' + rid;
  localStorage.setItem('mewhelp_user_id', userId);
}
let busy = false;

document.querySelectorAll('.cat-svg').forEach(el => el.innerHTML = SVG_CAT);

function scrollBottom(){ $chat.scrollTop = $chat.scrollHeight; }

function bubble(kind){
  const row = document.createElement('div');
  row.className = 'row ' + kind;
  if (kind === 'ai'){
    const av = document.createElement('div');
    av.className = 'avatar cat-svg'; av.innerHTML = SVG_CAT;
    row.appendChild(av);
  }
  const b = document.createElement('div');
  b.className = 'bubble';
  row.appendChild(b);
  $chat.appendChild(row); scrollBottom();
  return b;
}

function systemMsg(text, isErr){
  const row = document.createElement('div');
  row.className = 'row system';
  const b = document.createElement('div');
  b.className = 'bubble';
  if (isErr) b.classList.add('err-text');
  b.textContent = text;
  row.appendChild(b); $chat.appendChild(row); scrollBottom();
}

function typingOn(){
  const row = document.createElement('div');
  row.className = 'row ai typing';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  row.appendChild(b); $chat.appendChild(row); scrollBottom();
  return row;
}

function ask(){
  const text = $box.value.replace(/\n+$/,'').trim();
  if (!text || busy) return;

  // 用户气泡
  const ub = bubble('user'); ub.textContent = text;
  $box.value = ''; autoGrow();
  const trow = typingOn();

  busy = true; $send.disabled = true;

  fetch('/api/chat', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ user_id: userId, conversation_id: conversationId, message: text })
  }).then(async res => {
    if (!res.ok || !res.body){
      let detail = '服务暂时不可用(' + res.status + ')';
      try { detail = (await res.json()).detail || detail; } catch(_){}
      throw new Error(detail);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    let ai = null;
    let gotToken = false;
    // 工具轨迹徽章:按 call_id 复用同一个 chip,running → ok / error 原地更新
    let trail = null;
    const chipEls = {};
    const ensureTrail = () => {
      if (!trail) {
        trail = document.createElement('div');
        trail.className = 'tool-trail';
        if (trow.parentNode) $chat.insertBefore(trail, trow); else $chat.appendChild(trail);
        scrollBottom();
      }
      return trail;
    };
    const renderTool = d => {
      const key = d.call_id || d.name || 'tool';
      let chip = chipEls[key];
      if (!chip) {
        chip = document.createElement('span');
        chipEls[key] = chip;
        ensureTrail().appendChild(chip);
      }
      const status = d.status || '';
      const icon = status === 'running' ? '<span class="spin">🐾</span>' : (status === 'ok' ? '✅' : '⚠️');
      chip.className = 'chip ' + status;
      chip.innerHTML = icon + ' ' + (d.name || '工具');
      chip.title = status === 'running' ? '调用中' : (d.summary || status);
      scrollBottom();
    };
    const onFrame = frame => {
      if (!frame) return;
      const name = (frame.event || '').trim();
      let data = null;
      try { data = frame.data && JSON.parse(frame.data); } catch(_){ data = { content: frame.data }; }
      if (name === 'session') {
        // 服务端新建会话并回传 id:后续轮次带上它,历史才不会断
        if (data && data.conversation_id != null) conversationId = data.conversation_id;
      }
      else if (name === 'tool') {
        renderTool(data || {});
      }
      else if (name === 'delta'){
        if (!gotToken){ trow.remove(); ai = bubble('ai'); ai.classList.add('streaming'); gotToken = true; }
        const chunk = (data && typeof data.content === 'string') ? data.content : '';
        ai.textContent += chunk; scrollBottom();
      }
      else if (name === 'error'){
        if (ai){ ai.classList.remove('streaming'); ai.classList.add('err-text'); ai.textContent += (data && data.message ? '\n⚠ ' + data.message : ''); }
        else { trow.remove(); systemMsg((data && data.message) || '出错了,请稍后再试', true); }
        ai = null; gotToken = true;
      }
      else if (name === 'done'){
        if (data && data.conversation_id != null) conversationId = data.conversation_id;
        if (ai){ ai.classList.remove('streaming'); ai = null; }
        else if (!gotToken){ trow.remove(); } // 空回复:不留空气泡
      }
    };
    const dispatch = block => {
      if (!block || !block.trim()) return;
      const frame = { event: '', data: '' };
      for (const line of block.split('\n')){
        if (line.startsWith('event:')) frame.event = line.slice(6).trim();
        else if (line.startsWith('data:')) frame.data = (frame.data ? frame.data + '\n' : '') + line.slice(5).trim();
      }
      onFrame(frame);
    };
    while (true){
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while ((i = buf.indexOf('\n\n')) !== -1){ dispatch(buf.slice(0,i)); buf = buf.slice(i+2); }
    }
    if (buf.trim()) dispatch(buf);
  }).catch(err => {
    trow.remove();
    systemMsg('⚠ ' + err.message, true);
  }).finally(() => {
    busy = false; $send.disabled = false; $box.focus();
  });
}

function autoGrow(){ $box.style.height = 'auto'; $box.style.height = Math.min($box.scrollHeight,120) + 'px'; }
$box.addEventListener('input', autoGrow);
$box.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ask(); }
});
$send.addEventListener('click', ask);
$reset.addEventListener('click', () => {
  conversationId = null;   // 下一轮由服务端新建会话
  $chat.innerHTML = '';
  systemMsg('已开启新会话,请开始提问~');
  $box.focus();
});

// 开场问候
systemMsg('你好呀,我是小喵 🐾 有什么售后问题尽管问~ 比如订单查询、退换货、维修都可以。');
autoGrow(); $box.focus();
</script>
</body>
</html>
